spring:
  application:
    name: hhplus
  profiles:
    active: local
  main:
    allow-bean-definition-overriding: true
  datasource:
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000
      max-lifetime: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC

---
spring:
  datasource:
    url: jdbc:mysql://localhost:13306/hhplus?useSSL=false
    username: application
    password: application
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: localhost
      port: 16379

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: token-activation-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "kr.hhplus.be.server.domain.auth.models"
        request.timeout.ms: 30000
        session.timeout.ms: 10000
      max-poll-records: 10
      fetch-max-wait: 1000
      enable-auto-commit: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        request.timeout.ms: 30000
    admin:
      properties:
        bootstrap.servers: localhost:19092
        request.timeout.ms: 30000
        connections.max.idle.ms: 30000
        retries: 3

concert:
  default-seats-per-schedule: 50
  max-seats-per-schedule: 1000
  reservation-timeout-minutes: 5
  max-reservations-per-user: 10
  max-concurrent-reservations: 3
  min-concert-duration-minutes: 30
  max-concert-duration-minutes: 480
  min-schedule-advance-hours: 1
  queue:
    token-expiry-minutes: 5
    kafka:
      enabled: true

cache:
  key-prefix: "concert-service:"
  default-ttl: PT30M
  concerts:
    ttl: PT2H
  concert-schedules:
    ttl: PT1H
  concert-details:
    ttl: PT30M
  available-concerts:
    ttl: PT5M
  available-seats:
    ttl: PT2M
  popular-concerts:
    ttl: PT10M
  trending-concerts:
    ttl: PT3M
  system-types:
    ttl: PT24H
  system-config:
    ttl: PT12H
  user-balance:
    ttl: PT5M
  token-status:
    ttl: PT1M

mock-api:
  enabled: true
  base-url: http://localhost:8080