spring:
  application:
    name: hhplus
  profiles:
    active: local
  datasource:
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000
      max-lifetime: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC

---
spring:
  datasource:
    url: jdbc:mysql://localhost:13306/hhplus?useSSL=false
    username: application
    password: application
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: localhost
      port: 16379

concert:
  default-seats-per-schedule: 50
  max-seats-per-schedule: 1000
  reservation-timeout-minutes: 5
  max-reservations-per-user: 10
  max-concurrent-reservations: 3
  min-concert-duration-minutes: 30
  max-concert-duration-minutes: 480
  min-schedule-advance-hours: 1
  queue:
    max-active-tokens: 100
    token-expiry-minutes: 5
    waiting-time-multiplier: 2
    tokens-per-minute: 10

cache:
  key-prefix: "concert-service:"
  default-ttl: PT30M
  concerts:
    ttl: PT2H
  concert-schedules:
    ttl: PT1H
  concert-details:
    ttl: PT30M
  available-concerts:
    ttl: PT5M
  available-seats:
    ttl: PT2M
  popular-concerts:
    ttl: PT10M
  trending-concerts:
    ttl: PT3M
  system-types:
    ttl: PT24H
  system-config:
    ttl: PT12H
  user-balance:
    ttl: PT5M
  token-status:
    ttl: PT1M